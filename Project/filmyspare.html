<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Style UI</title>

    <!-- External CSS Link -->
    <link rel="stylesheet" href="filmyspare.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">FilmySpare</div>
    <button class="sign-in">Sign In</button>
</div>

<!-- HERO SECTION -->
<section class="hero">
    <div class="hero-content">
        <h1>New trending movies, TV shows and more</h1>
        <h2>Watch anywhere. At just Rs.199/- month</h2>
        <p>Ready to watch? Enter your email to get started.</p>

        <div class="form">
            <input type="email" placeholder="Email address">
            <button>Get Started ></button>
        </div>
    </div>
</section>

<!-- MOVIES SECTION -->
<section class="movies-section">

    <h2 class="section-title">Trending Movies</h2>

    <div class="movie-row">
        <div class="movie-card">
            <img src="movie1.jpg" alt="Movie 1">
            <p>Action Hero</p>
        </div>

        <div class="movie-card">
            <img src="movie2.avif" alt="Movie 2">
            <p>Action Thrilling</p>
        </div>

        <div class="movie-card">
            <img src="movie3.jpg" alt="Movie 3">
            <p>Comedy</p>
        </div>

        <div class="movie-card">
            <img src="movie4.webp" alt="Movie 4">
            <p>Sci-fi</p>
        </div>
    </div>

</section>

</body>
</html>
